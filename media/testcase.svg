<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 16 16"
     fill="none"
     stroke="currentColor"
     stroke-width="1"
     stroke-linecap="round"
     stroke-linejoin="round">

  <!-- Outer box -->
  <rect x="1" y="1" width="14" height="14" rx="1"/>

  <!-- Input -->
  <polyline points="3,3.5 4.5,4.5 3,5.5"/>
  <line x1="6.2" y1="4.5" x2="9.8" y2="4.5"/>

  <!-- Output -->
  <polyline points="4.5,7.5 3,8.5 4.5,9.5"/>
  <line x1="6.2" y1="8.5" x2="9.8" y2="8.5"/>

  <!-- Bigger Tick -->
  <path d="M3.0 11.4 L4.7 13.1 L7.3 10.0"/>

  <!-- Bigger Cross -->
  <line x1="9.8" y1="10.2" x2="13.0" y2="13.4"/>
  <line x1="13.0" y1="10.2" x2="9.8" y2="13.4"/>

</svg>